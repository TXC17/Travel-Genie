version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Container
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: travel_genie_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: travel_genie
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d travel_genie"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - travel_genie_net

  # ----------------------------------------------------------------------------
  # FastAPI Backend Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: travel_genie_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@db:5432/travel_genie
      - SECRET_KEY=dev_insecure_secret_key_change_in_production_9f83ac6b39
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - ALLOWED_ORIGINS=["http://localhost:5173","http://localhost:3000"]
    volumes:
      - ./backend:/app
      - ./data:/app/data
    networks:
      - travel_genie_net

  # ----------------------------------------------------------------------------
  # React + Vite Frontend Service
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: travel_genie_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - travel_genie_net

volumes:
  postgres_data:
    driver: local

networks:
  travel_genie_net:
    driver: bridge
